<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Tensor Rails</title>
<desc id="desc">Open-source tools and services for running inference and training workloads.</desc>
<defs>
  <clipPath id="card"><rect width="1280" height="360" rx="20"/></clipPath>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
  </pattern>
  <radialGradient id="gridfade" cx="980" cy="188" r="420" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1280" height="360" fill="url(#gridfade)"/></mask>
  <radialGradient id="glowp" cx="882" cy="148" r="240" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#9b4dff" stop-opacity="0.22"/><stop offset="1" stop-color="#9b4dff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowb" cx="1078" cy="148" r="240" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1e9bff" stop-opacity="0.22"/><stop offset="1" stop-color="#1e9bff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="railp" x1="680" y1="40" x2="980" y2="360" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#e29bff"/><stop offset=".55" stop-color="#9b4dff"/><stop offset="1" stop-color="#5b21b6"/>
  </linearGradient>
  <linearGradient id="railb" x1="1280" y1="40" x2="980" y2="360" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#6fdcff"/><stop offset=".55" stop-color="#1e9bff"/><stop offset="1" stop-color="#1d4ed8"/>
  </linearGradient>
  <linearGradient id="fadex" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0.531" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.617" stop-color="#fff"/>
    <stop offset="0.914" stop-color="#fff"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fadey" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
    <stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/>
  </linearGradient>
  <mask id="fx"><rect width="1280" height="360" fill="url(#fadex)"/></mask>
  <mask id="fy"><rect width="1280" height="360" fill="url(#fadey)"/></mask>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="halo" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>
<g clip-path="url(#card)">
